<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completing Google sign-in</title><style>body{font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh;background:#f7f6f1;color:#172321}.card{padding:24px;border:1px solid #d8dfdc;border-radius:16px;background:#fff;max-width:420px}</style></head>
<body><main class="card"><h1>Completing sign-in</h1><p id="status">Returning securely to Family Documents…</p></main><script>
(()=>{const params=new URLSearchParams(location.hash.slice(1)||location.search.slice(1)),payload={type:"family-passport-google-oauth",access_token:params.get("access_token"),refresh_token:params.get("refresh_token"),expires_in:params.get("expires_in"),error:params.get("error"),error_description:params.get("error_description")},allowed=["https://familydocuments.app","https://familydocuments.inderchauhan.workers.dev","http://127.0.0.1:3300"];if(window.opener&&allowed.includes(location.origin)){window.opener.postMessage(payload,location.origin);window.close()}else document.querySelector("#status").textContent="The original Family Documents window is unavailable. Close this page and try again."})();
</script></body></html>
