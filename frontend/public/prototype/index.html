<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Family Documents</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Family Documents">
      <a class="brand" href="#home" data-route="home" aria-label="Family Documents home">
        <span class="brand-mark" aria-hidden="true">FD</span><span>Family Documents<small>Your household hub</small></span>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="#home" data-route="home"><span aria-hidden="true">⌂</span>Overview</a>
        <a href="#inbox" data-route="inbox"><span aria-hidden="true">✉</span>Inbox</a>
        <a href="#records" data-route="records"><span aria-hidden="true">▤</span>Documents</a>
        <a href="#rentals" data-route="rentals"><span aria-hidden="true">⌂</span>Rentals</a>
        <a href="#saved" data-route="saved"><span aria-hidden="true">♡</span>Saved links</a>
        <a href="#search" data-route="search"><span aria-hidden="true">⌕</span>Search</a>
        <a href="#connections" data-route="connections"><span aria-hidden="true">◇</span>Storage</a>
        <a href="#household" data-route="household"><span aria-hidden="true">⚙</span>Settings</a>
      </nav>
      <button class="add-button" type="button" data-route-button="addChoice"><span aria-hidden="true">＋</span>Add</button>
      <div class="sidebar-foot">
        <button class="nav-button" type="button" data-help><span aria-hidden="true">?</span>Help</button>
      </div>
    </aside>

    <header class="mobile-header">
      <a class="brand" href="#home" data-route="home"><span class="brand-mark" aria-hidden="true">FD</span><span>Family Documents</span></a>
      <div class="mobile-actions"><button class="icon-button mobile-family-button" type="button" data-route-button="household" aria-label="Family members and invitations"><span aria-hidden="true">♙</span><span>Family</span></button><button class="icon-button" type="button" data-help aria-label="Open help">?</button></div>
    </header>

    <main id="main" tabindex="-1">
      <div id="screen"></div>
      <p id="app-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </main>

    <nav class="mobile-nav" aria-label="Primary navigation">
      <a href="#home" data-route="home"><span aria-hidden="true">⌂</span>Overview</a>
      <a href="#inbox" data-route="inbox"><span aria-hidden="true">✉</span>Inbox</a>
      <a href="#records" data-route="records"><span aria-hidden="true">▤</span>Documents</a>
      <a href="#rentals" data-route="rentals"><span aria-hidden="true">⌂</span>Rentals</a>
      <a href="#search" data-route="search"><span aria-hidden="true">⌕</span>Search</a>
      <a href="#saved" data-route="saved"><span aria-hidden="true">♡</span>Saved</a>
    </nav>
    <button class="mobile-add" type="button" data-route-button="addChoice" aria-label="Add information">＋</button>
  </div>

  <section id="scenario-panel" hidden><select id="scenario"><option value="default">Default</option></select><button id="scenario-toggle" hidden></button><button id="scenario-close" hidden></button></section>

  <dialog id="help-dialog" aria-labelledby="help-title">
    <form method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">Help</p><h2 id="help-title">What can I do here?</h2></div><button class="icon-button" value="close" aria-label="Close help">×</button></div>
      <div id="help-content"></div>
      <button class="primary-button" value="close">Return to my task</button>
    </form>
  </dialog>
  <dialog id="document-preview-dialog" class="document-preview-dialog" aria-labelledby="document-preview-title">
    <form method="dialog" class="preview-toolbar"><h2 id="document-preview-title">Document preview</h2><button class="icon-button" value="close" aria-label="Close document preview">×</button></form>
    <iframe id="document-preview-frame" title="Document preview" hidden></iframe>
    <img id="document-preview-image" hidden alt="">
  </dialog>

  <script src="model.js"></script>
  <script src="auth-client.js"></script>
  <script src="data-client.js"></script>
  <script src="ocr-client.js"></script>
  <script src="google-drive-config.local.js"></script>
  <script src="google-drive-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
